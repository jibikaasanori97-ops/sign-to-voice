<style>
  :root {
    --bg: #0b0d13;
    --bg-2: #11141d;
    --panel: #161a25;
    --panel-border: #262c3c;
    --text: #eef1f7;
    --muted: #8890a3;
    --accent: #5ad1a3;
    --accent-dim: #2f5b48;
  }
  :root[data-theme="light"] {
    --bg: #f3f5f8;
    --bg-2: #e9ecf2;
    --panel: #ffffff;
    --panel-border: #dde1ea;
    --text: #171a21;
    --muted: #5b6373;
    --accent: #1f9d73;
    --accent-dim: #cdeee1;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f5f8;
      --bg-2: #e9ecf2;
      --panel: #ffffff;
      --panel-border: #dde1ea;
      --text: #171a21;
      --muted: #5b6373;
      --accent: #1f9d73;
      --accent-dim: #cdeee1;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(60% 50% at 50% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    padding: 32px 16px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 28px 24px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    box-shadow: 0 20px 60px -30px rgba(0,0,0,0.5);
  }

  .mark {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
  }

  .mark svg { width: 28px; height: 28px; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }

  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    text-wrap: balance;
    line-height: 1.4;
  }

  .qr-frame {
    background: #ffffff;
    border-radius: 14px;
    padding: 14px;
    line-height: 0;
  }

  .qr-frame img {
    display: block;
    width: 200px;
    height: 200px;
    image-rendering: pixelated;
  }

  .url-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 12px;
  }

  .url-row a {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
    text-decoration: none;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 12.5px;
  }

  .copy-btn {
    flex-shrink: 0;
    border: none;
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 6px 10px;
    border-radius: 7px;
    cursor: pointer;
  }
  .copy-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  ol.steps {
    width: 100%;
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  ol.steps li {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.5;
  }

  ol.steps li b {
    color: var(--text);
    font-weight: 600;
  }

  ol.steps .n {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 10.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, monospace;
  }

  .note {
    width: 100%;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--muted);
    border-top: 1px solid var(--panel-border);
    padding-top: 14px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise 0.5s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }
</style>

      <path d="M16 12V8.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L4.7 14a1.4 1.4 0 0 1 2.2-1.7L7 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

</div>

<script>
  document.getElementById('copyBtn').addEventListener('click', async () => {
    const url = 'https://jibikaasanori97-ops.github.io/sign-to-voice/';
    const btn = document.getElementById('copyBtn');
    try {
      await navigator.clipboard.writeText(url);
      btn.textContent = 'コピー済み';
    } catch {
      btn.textContent = url;
    }
    setTimeout(() => { btn.textContent = 'コピー'; }, 1500);
  });
</script>
